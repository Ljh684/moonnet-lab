name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain version
        run: moon version --all

      # The command line tool reads scenario files, which needs the official
      # extended library, and a fresh runner has an index that predates it.
      - name: Update the package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test

      # Exercises the scenario files end to end: reading them from disk,
      # running one, and comparing algorithms on the same path.
      - name: Run the scenario tools
        run: |
          moon run cmd/moonnet -- list
          moon run cmd/moonnet -- compare scenarios/long-fat.json --cc reno,cubic
