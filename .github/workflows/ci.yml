name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain version
        run: moon version --all

      # The command line tool reads scenario files, which needs the official
      # extended library, and a fresh runner has an index that predates it.
      - name: Update the package registry
        run: moon update

      - name: Check formatting
        run: moon fmt --check

      - name: Type check
        run: moon check

      - name: Run tests
        run: moon test

      # Exercises the scenario files end to end: reading them from disk,
      # running one, and comparing algorithms on the same path.
      - name: Run the scenario tools
        run: |
          moon run cmd/moonnet -- list
          moon run cmd/moonnet -- compare scenarios/long-fat.json --cc reno,cubic
          moon run cmd/moonnet -- run scenarios/bufferbloat.json --discipline codel
          moon run cmd/moonnet -- run scenarios/small-buffers.json --trace --json > trace.json
          moon run cmd/moonnet -- plot trace.json > trace.svg
          moon run cmd/moonnet -- plot trace.json > trace-again.svg
          cmp trace.svg trace-again.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("trace.svg").getroot()
          ns = {"svg": "http://www.w3.org/2000/svg"}
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          assert len(root.findall(".//svg:polyline", ns)) == 4
          assert any("event " in node.get("class", "") for node in root.findall(".//svg:line", ns))
          assert any(node.get("class") == "stall" for node in root.findall(".//svg:rect", ns))
          PY

      # The multi-flow chart is a second renderer behind the same command: the
      # trace says which flows exist, and the chart has to carry every one of
      # them, with the totals the report states, over the shared queues.
      - name: Produce a fairness trace and chart
        run: |
          moon run cmd/moonnet -- run scenarios/fairness.json --trace --json > fairness-trace.json
          moon run cmd/moonnet -- plot fairness-trace.json > fairness-chart.svg
          moon run cmd/moonnet -- plot fairness-trace.json > fairness-chart-again.svg
          cmp fairness-chart.svg fairness-chart-again.svg
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          trace = json.load(open("fairness-trace.json"))
          flows = trace["report"]["flows"]
          assert trace["flows"] == len(flows) == 4
          root = ET.parse("fairness-chart.svg").getroot()
          text = "".join(root.itertext())
          assert "flows sharing one path" in text
          for flow in flows:
              assert f"flow {flow['flow']}" in text
              assert f"{flow['delivered_bytes']} B" in text
          assert "uplink queue" in text and "downlink queue" in text
          PY

      # The command line tool is one consumer of the library. These two are
      # consumers that do not use it at all, which is the claim the repository
      # makes about being usable as a dependency.
      - name: Run the example consumers
        run: |
          moon run examples/embed_tcp/main
          moon run examples/rpc_retry/main
